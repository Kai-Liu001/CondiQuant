bit: 4
cali_data: keydata/cali_data_x4.pth
condiquant:
  enabled: true
  exclude_mlp: true
  lambda_reg: 0.003
  learning_rate: 0.01
  num_iterations: 50
datasets:
  test_1:
    dataroot_gt: datasets/benchmark/Set5/HR
    dataroot_lq: datasets/benchmark/Set5/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
    name: Set5
    task: SR
    type: PairedImageDataset
  test_2:
    dataroot_gt: datasets/benchmark/Set14/HR
    dataroot_lq: datasets/benchmark/Set14/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
    name: Set14
    task: SR
    type: PairedImageDataset
  test_3:
    dataroot_gt: datasets/benchmark/B100/HR
    dataroot_lq: datasets/benchmark/B100/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
    name: B100
    task: SR
    type: PairedImageDataset
  test_4:
    dataroot_gt: datasets/benchmark/Urban100/HR
    dataroot_lq: datasets/benchmark/Urban100/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
    name: Urban100
    task: SR
    type: PairedImageDataset
  test_5:
    dataroot_gt: datasets/benchmark/Manga109/HR
    dataroot_lq: datasets/benchmark/Manga109/LR_bicubic/X4
    filename_tmpl: '{}_LRBI_x4'
    io_backend:
      type: disk
    name: Manga109
    task: SR
    type: PairedImageDataset
gpu: 0
manual_seed: 0
model_type: CondiQuantModel
name: test_CondiQuant_x4_bit4
network_Q:
  depths:
  - 6
  - 6
  - 6
  - 6
  embed_dim: 60
  img_range: 1.0
  img_size: 64
  mlp_ratio: 2
  num_heads:
  - 6
  - 6
  - 6
  - 6
  type: SwinIR
  upsampler: pixelshuffledirect
  upscale: 4
  window_size: 8
num_gpu: 1
path:
  pretrain_network_Q: experiments/train_CondiQuant_x4_bit4/models/net_Q_latest.pth
  strict_load_Q: true
pathFP:
  pretrain_network_FP: experiments/pretrained_models/SwinIR/002_lightweightSR_DIV2K_s64w8_SwinIR-S_x4.pth
  strict_load_FP: true
quant:
  bound_init: dobi
  hook_per_block: false
  hook_per_layer: true
  qkv_separation: true
scale: 4
val:
  metrics:
    psnr:
      crop_border: 4
      test_y_channel: true
      type: calculate_psnr
    ssim:
      crop_border: 4
      test_y_channel: true
      type: calculate_ssim
  patchwise_testing: false
  save_img: false
  selfensemble_testing: false
  suffix: null
